<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1162 150" width="1162" height="150" role="img" aria-label="Résultats de missions : −70 % d’arrêts non planifiés, −30 % de ruptures, propositions en 5 minutes au lieu de 4 heures, reporting en moins de 30 minutes">
<defs><linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#F27A21"/><stop offset="1" stop-color="#FFAD73"/></linearGradient></defs>
<style>
  .card { animation: up .7s cubic-bezier(.2,.9,.25,1) both; }
  @keyframes up { from { opacity: 0; transform: translateY(18px) } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
</style>
<g class="card" style="animation-delay:0.15s" transform="translate(0,0)">
  <rect width="280" height="150" rx="12" fill="#141A32"/>
  <rect x="0" y="0" width="280" height="4" rx="2" fill="url(#accent)"/>
  <text x="20" y="62" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#F27A21">−70 %</text>
  <text x="20" y="96" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ECE7DC">d’arrêts non planifiés</text>
  <text x="20" y="126" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, Menlo, monospace" font-size="11.5" fill="#8D96B5">industrie · maintenance prédictive</text>
</g>
<g class="card" style="animation-delay:0.33s" transform="translate(294,0)">
  <rect width="280" height="150" rx="12" fill="#141A32"/>
  <rect x="0" y="0" width="280" height="4" rx="2" fill="url(#accent)"/>
  <text x="20" y="62" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#F27A21">−30 %</text>
  <text x="20" y="96" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ECE7DC">de ruptures de stock</text>
  <text x="20" y="126" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, Menlo, monospace" font-size="11.5" fill="#8D96B5">distribution · prévision de la demande</text>
</g>
<g class="card" style="animation-delay:0.51s" transform="translate(588,0)">
  <rect width="280" height="150" rx="12" fill="#141A32"/>
  <rect x="0" y="0" width="280" height="4" rx="2" fill="url(#accent)"/>
  <text x="20" y="62" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#F27A21">5 min</text>
  <text x="20" y="96" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ECE7DC">par offre, au lieu de 4 h</text>
  <text x="20" y="126" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, Menlo, monospace" font-size="11.5" fill="#8D96B5">services B2B · offres commerciales</text>
</g>
<g class="card" style="animation-delay:0.69s" transform="translate(882,0)">
  <rect width="280" height="150" rx="12" fill="#141A32"/>
  <rect x="0" y="0" width="280" height="4" rx="2" fill="url(#accent)"/>
  <text x="20" y="62" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#F27A21">&lt; 30 min</text>
  <text x="20" y="96" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ECE7DC">de reporting, au lieu de 4 à 6 h</text>
  <text x="20" y="126" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, Menlo, monospace" font-size="11.5" fill="#8D96B5">toutes équipes · automatisation</text>
</g>
</svg>
